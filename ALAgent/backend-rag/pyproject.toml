[project]
name = "al-agent-rag"
version = "0.1.0"
description = "RAG Backend for AL Agent - Code Context Retrieval Service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "langchain-community>=0.0.10",
    "langchain-milvus>=0.1.0",
    "pymilvus>=2.4.0",
    # LightRAG - Graph-based RAG
    "lightrag-hku>=1.4.0",
    "dashscope>=1.14.0",
    "numpy>=1.24.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "ragas>=0.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "tiktoken>=0.5.2",
    # Web crawling
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "html2text>=2024.2.26",
    # GitHub
    "pygithub>=2.1.0",
    "gitpython>=3.1.40",
    # PDF processing
    "pymupdf>=1.24.0",  # 轻量级 PDF 解析，比 pdfplumber 快且省内存
    "pypdf>=3.17.0",
    "pdfplumber>=0.10.0",
    # Document processing
    "unstructured>=0.12.0",
    "markdown>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
